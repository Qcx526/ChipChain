[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipchain"
version = "0.1.0"
description = "Evidence-guided cross-layer chip vulnerability chain detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "ChipChain contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "networkx>=3.4,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
angr = [
  "angr==9.3.2",
]
llm = [
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]
dev = [
  "pytest>=8.0,<10",
]

[project.scripts]
chipchain = "chipchain.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "angr: requires the optional angr backend and auditable ARM binary fixture",
]
